  }
 });
 spikes.forEach(s=>{if(me.x<s.x+TILE&&me.x+me.w>s.x&&me.y<s.y+TILE&&me.y+me.h>s.y){sfx('dead');for(let i=0;i<8;i++) particles.push({x:me.x+14,y:me.y+14,vx:(Math.random()-0.5)*8,vy:(Math.random()-0.5)*8,life:20});me.x=60;me.y=isHost?60:100;}});
 if(me.x<finish.x+TILE&&me.x+me.w>finish.x&&me.y<finish.y+TILE&&me.y+me.h>finish.y){
  let other=isHost?players.guest:players.host;
  if(other.x<finish.x+TILE*1.8&&other.x+other.w>finish.x-TILE/2&&other.y<finish.y+TILE*1.8&&other.y+other.h>finish.y-TILE/2){
   if(level<9){level++;loadLevel(level);sfx('win');if(conn) conn.send({t:'lvl',n:level});}else{sfx('win');if(conn) conn.send({t:'winAll'});setTimeout(()=>{alert('TAMAT 10 LEVEL!');location.reload();},400);}
  }
 }
 if(conn&&conn.open) conn.send({t:'pos',x:me.x,y:me.y});
 particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.life--;});particles=particles.filter(p=>p.life>0);
}
function draw(){
 ctx.clearRect(0,0,canvas.width,canvas.height);
 if(doorOpen){ctx.fillStyle='rgba(0,255,136,0.12)';ctx.fillRect(0,0,canvas.width,canvas.height);}
 let m=maps[level];
 for(let y=0;y<m.length;y++) for(let x=0;x<m[y].length;x++){
  let v=m[y][x];
  if(v==1){ctx.fillStyle='#22223a';ctx.fillRect(x*TILE,y*TILE,TILE,TILE);}
  if(v==2){ctx.fillStyle='#ff0033';ctx.shadowColor='#ff0033';ctx.shadowBlur=10;ctx.fillRect(x*TILE+10,y*TILE+10,TILE-20,TILE-20);ctx.shadowBlur=0;}
  if(v==3){ctx.fillStyle=redPressed?'#ff1a1a':'#4a0000';ctx.shadowBlur=redPressed?15:0;ctx.shadowColor='#ff0000';ctx.fillRect(x*TILE+4,y*TILE+4,TILE-8,TILE-8);ctx.shadowBlur=0;ctx.fillStyle='#fff';ctx.font='bold 13px sans-serif';ctx.fillText('R',x*TILE+14,y*TILE+24);}
  if(v==4){ctx.fillStyle=bluePressed?'#1a7dff':'#001a4a';ctx.shadowBlur=bluePressed?15:0;ctx.shadowColor='#0066ff';ctx.fillRect(x*TILE+4,y*TILE+4,TILE-8,TILE-8);ctx.shadowBlur=0;ctx.fillStyle='#fff';ctx.fillText('B',x*TILE+14,y*TILE+24);}
  if(v==5&&!doorOpen){ctx.fillStyle='#ffcc00';ctx.shadowColor='#ffcc00';ctx.shadowBlur=12;ctx.fillRect(x*TILE,y*TILE,TILE,TILE);ctx.shadowBlur=0;}
  if(v==6){ctx.fillStyle='#00ff88';ctx.shadowColor='#00ff88';ctx.shadowBlur=18;ctx.fillRect(x*TILE,y*TILE,TILE,TILE);ctx.shadowBlur=0;ctx.fillStyle='#000';ctx.font='bold 11px sans-serif';ctx.fillText('EXIT',x*TILE+4,y*TILE+24);}
 }
 for(let k in players){let p=players[k];ctx.shadowColor=p.color;ctx.shadowBlur=14;ctx.fillStyle=p.color;ctx.fillRect(p.x,p.y,p.w,p.h);ctx.shadowBlur=0;ctx.fillStyle='#fff';ctx.font='16px sans-serif';ctx.fillText(p.skin||'🔥',p.x+2,p.y-4);}
 particles.forEach(p=>{ctx.fillStyle=`rgba(255,60,90,${p.life/20})`;ctx.fillRect(p.x,p.y,4,4);});
}
function loop(){update();draw();document.getElementById('coord').innerText=`R:${redPressed?'ON':'OFF'} B:${bluePressed?'ON':'OFF'}`;requestAnimationFrame(loop);}
window.addEventListener('keydown',e=>keys[e.key]=true);window.addEventListener('keyup',e=>keys[e.key]=false);
function bind(id,key){let el=document.getElementById(id);if(!el) return;el.addEventListener('touchstart',e=>{e.preventDefault();keys[key]=true});el.addEventListener('touchend',e=>{e.preventDefault();keys[key]=false});}
bind('left','l');bind('right','r');bind('up','u');bind('down','s');
</script></body></html>
